name: Generate contribution snake

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate neon snake SVG
        run: |
          mkdir -p assets
          npx --yes @snake-evolution/cli@latest generate -u Madiha-Shahid0212 -o assets/github-contribution-grid-snake.svg -t neon-gamer

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: assets/github-contribution-grid-snake.svg
